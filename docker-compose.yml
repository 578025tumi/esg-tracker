services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: esgdb
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:[supabaseadmin123]@db.qjkwowojexxkwrttflxw.supabase.co:5432/postgres
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  worker:
    build: ./backend
    command: python worker.py
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:[supabaseadmin123]@db.qjkwowojexxkwrttflxw.supabase.co:5432/postgres
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  frontend:
    build: ./esg-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000